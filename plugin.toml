[plugin]
id = "neko_live"
name = "直播助手"
previous_ids = [
    "neko_roast",
]
description = "NEKO 的直播互动中心：连接支持的平台直播互动，承载弹幕、观众档案与锐评流程。"
short_description = "NEKO 的直播互动中心。"
keywords = [
    "bilibili",
    "danmaku",
    "avatar",
    "roast",
    "neko_live",
    "live_center",
    "直播互动",
    "弹幕锐评",
    "观众",
]
passive = true
version = "3.5.1"
entry = "plugin.plugins.neko_live:NekoLivePlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.ui]
enabled = true
# The live panel is hosted TSX. A static/index.html makes the host show
# "打开界面", which only opened a blank page.
expose_legacy_static_panel = false

[[plugin.ui.panel]]
id = "main"
title = { "$i18n" = "panel.title", default = "直播助手" }
entry = "ui/panel_compat.tsx"
context = "dashboard"
permissions = [
    "state:read",
    "config:read",
    "action:call",
]

[[plugin.ui.guide]]
id = "quickstart"
title = "快速开始"
entry = "docs/quickstart.md"
mode = "markdown"
permissions = [
    "state:read",
]

[[plugin.ui.guide]]
id = "development"
title = "开发文档"
entry = "docs/development.md"
mode = "markdown"
permissions = [
    "state:read",
]

[[plugin.ui.guide]]
id = "solo_stream_test"
title = "猫猫独播体验指南"
entry = "docs/solo-stream-test-guide.md"
mode = "markdown"
permissions = [
    "state:read",
]

[plugin.store]
enabled = true
