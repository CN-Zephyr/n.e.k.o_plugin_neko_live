# Keep the pinned N.E.K.O revision in sync with release.yml and panel.yml.
name: Verify N.E.K.O Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-verify.yml@5455f5ba845d6ba3f3cdac305436d03af332756d
    with:
      plugin-id: neko_live
      neko-repository: Project-N-E-K-O/N.E.K.O
      neko-ref: 5455f5ba845d6ba3f3cdac305436d03af332756d

  windows-native:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: live-plugin
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Project-N-E-K-O/N.E.K.O
          ref: 5455f5ba845d6ba3f3cdac305436d03af332756d
          path: neko
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Mount the plugin source
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "live-plugin" -Destination "neko/plugin/plugins/neko_live" -Recurse
      - name: Test Windows credential and process behavior
        working-directory: neko
        shell: pwsh
        run: |
          uv run --locked --python 3.11 pytest "plugin/plugins/neko_live/tests/test_credential_store.py" "plugin/plugins/neko_live/tests/test_live_bridge.py" -q -ra --junitxml "windows-native.xml"
      - name: Record Windows test outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-tests
          path: neko/windows-native.xml
