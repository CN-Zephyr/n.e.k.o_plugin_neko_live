# Keep the pinned N.E.K.O revision in sync with verify.yml and panel.yml.
name: Release N.E.K.O Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_HOST_SHA: 5455f5ba845d6ba3f3cdac305436d03af332756d

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-release.yml@5455f5ba845d6ba3f3cdac305436d03af332756d
    with:
      plugin-id: neko_live
      neko-repository: Project-N-E-K-O/N.E.K.O
      neko-ref: 5455f5ba845d6ba3f3cdac305436d03af332756d

  verify-published-assets:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Verify the uploaded assets and their build provenance
        shell: bash
        run: |
          set -euo pipefail
          signer="Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-release.yml"
          gh release download "$RELEASE_TAG" --pattern "neko_live.neko-plugin" --pattern "market-evidence.json"
          for asset in neko_live.neko-plugin market-evidence.json; do
            gh attestation verify "$asset" --repo "$GH_REPO" \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$SOURCE_SHA" \
              --signer-workflow "$signer" --signer-digest "$RELEASE_HOST_SHA" \
              --deny-self-hosted-runners
          done
          package_sha=$(sha256sum neko_live.neko-plugin | cut -d ' ' -f 1)
          jq -e --arg sha "$package_sha" --arg host "$RELEASE_HOST_SHA" --arg tag "$RELEASE_TAG" \
            '.mode == "release" and .ref_type == "tag" and .ref_name == $tag and .plugin_id == "neko_live" and
             .package.name == "neko_live.neko-plugin" and .package.sha256 == $sha and .neko_commit == $host' \
            market-evidence.json > /dev/null
          {
            printf '### Verified release assets\n\n'
            printf 'Package SHA-256: `%s`\n\n' "$package_sha"
            printf 'Host revision: `%s`\n' "$RELEASE_HOST_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
