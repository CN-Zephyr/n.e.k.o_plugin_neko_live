name: Hosted panel
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Project-N-E-K-O/N.E.K.O
          ref: 5455f5ba845d6ba3f3cdac305436d03af332756d
          path: host
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # panel_compat.tsx is generated; fail when it drifts from the modular sources.
      - run: python plugin/tools/build_panel_compat.py --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/frontend/plugin-manager/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: host/frontend/plugin-manager
      - run: node plugin/tools/check_panel.mjs host
